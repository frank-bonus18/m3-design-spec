name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 参考实现路径
        run: echo "ASSET=m3-design-spec/assets/m3-component-library.html" >> "$GITHUB_ENV"

      - name: 四项检查（一条命令）
        run: ./m3-design-spec/scripts/check.sh "$ASSET"

      - name: 检查器防篡改自检
        run: python3 m3-design-spec/scripts/selfcheck.py

      - name: 在线预览入口是否有效
        run: ./tools/sync-docs.sh

      - name: 脚本可执行位
        run: |
          fail=0
          for f in install.sh tools/sync-docs.sh m3-design-spec/scripts/*; do
            if [ ! -x "$f" ]; then
              echo "::error::$f 缺少可执行位"
              fail=1
            fi
          done
          exit $fail
